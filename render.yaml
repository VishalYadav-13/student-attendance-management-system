services:
  - type: web
    name: sams-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: sams-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://studentattendance-management-system.vercel.app,https://student-attendance-management-system.vercel.app,https://sams-frontend.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false

databases:
  - name: sams-db
    plan: free
    region: oregon
    databaseName: sams_db
    user: sams_user
